<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kanban de Pedidos · Belt Correias</title>
<meta name="theme-color" content="#424580">
<meta name="description" content="Acompanhamento visual (kanban) do andamento dos pedidos da Belt Correias.">
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kanban Belt">
<link rel="icon" type="image/png" sizes="48x48" href="./favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#f0f5fa;
    --surface:#ffffff;
    --surface-2:#f7fafc;
    --ink:#1e293b;
    --ink-2:#475569;
    --ink-3:#94a3b8;
    --line:#d1d5db;
    --line-2:#c3ccd6;
    --bar:#424580;
    --bar-2:#1b4264;
    --brand:#00adee;
    --brand-2:#0092c9;
    --brand-ink:#424580;
    --brand-tint:#e1f4fc;
    --red:#cf3a2c;
    --red-tint:#fbe6e3;
    --red-border:#de350b;
    --shadow-sm:0 1px 2px rgba(16,25,30,.08);
    --r:12px;
    --r-sm:8px;
    --sans:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    --num:'Space Grotesk','IBM Plex Sans',system-ui,sans-serif;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100vh}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:var(--bg);
    display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== TOPBAR ===== */
  .topbar{
    background:var(--bar);color:#eaf6f5;flex:0 0 auto;
    display:flex;align-items:center;gap:14px;padding:0 22px;height:60px;
  }
  .brand-lockup{display:flex;align-items:center;gap:12px}
  .brand-lockup .mark{width:34px;height:34px}
  .topbar .tb-title{font-family:var(--num);font-weight:600;font-size:15px}
  .topbar .tb-title small{display:block;font-family:var(--sans);font-weight:400;font-size:11px;color:#c3c6ea}
  .topbar .spacer{flex:1}
  .nav-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;padding:8px 14px;border-radius:var(--r-sm);text-decoration:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .nav-btn:hover{background:rgba(255,255,255,.2)}
  .nav-btn-install{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
  .nav-btn-install:hover{background:var(--brand-2);color:#fff}
  #lastUpdate{font-size:12px;color:#c3c6ea}
  .busca{
    width:260px;max-width:42vw;padding:8px 12px;border-radius:8px;
    border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);
    color:#fff;font-size:13px;font-family:inherit;
  }
  .busca::placeholder{color:#c3c6ea}
  .busca:focus{outline:none;background:#fff;color:var(--ink);border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,173,238,.25)}
  select.busca{width:210px;max-width:36vw;cursor:pointer}
  select.busca option{color:#1e293b}

  /* ===== BOARD ===== */
  .kanban-board{
    display:flex;gap:12px;overflow-x:auto;flex:1;align-items:flex-start;
    padding:16px 18px;
  }
  .kanban-column{
    background:var(--surface-2);
    width:270px;min-width:270px;
    border:1px solid var(--line);
    border-radius:var(--r);
    display:flex;flex-direction:column;max-height:100%;
    box-shadow:var(--shadow-sm);
  }
  .column-header{
    padding:12px 14px;font-weight:600;font-size:12.5px;
    text-transform:uppercase;letter-spacing:.4px;color:var(--ink-2);
    display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid var(--line);
  }
  .column-header .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brand);margin-right:8px;vertical-align:middle}
  .card-count{
    background:var(--brand-tint);color:var(--brand-2);
    padding:2px 9px;border-radius:10px;font-size:11.5px;font-weight:700;font-family:var(--num);
  }
  .hdr-right{display:flex;align-items:center;gap:6px}
  .btn-dl{
    width:22px;height:22px;padding:0;border:1px solid var(--line);background:#fff;color:var(--brand-2);
    border-radius:6px;cursor:pointer;font-size:12px;line-height:1;font-family:inherit;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .btn-dl:hover{background:var(--brand-tint);border-color:var(--brand)}
  .cards-container{
    padding:10px;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;min-height:80px;
  }

  /* ===== CARTÃO ===== */
  .card{
    position:relative;
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r-sm);padding:12px 13px;
    box-shadow:var(--shadow-sm);border-left:4px solid var(--brand);
  }
  .btn-lixo{
    position:absolute;top:8px;right:8px;display:none;
    width:26px;height:26px;border:none;border-radius:6px;cursor:pointer;
    background:var(--red);padding:0;align-items:center;justify-content:center;
  }
  .btn-lixo:hover{background:#b5281b}
  .card:hover .btn-lixo{display:inline-flex}
  .card.urgente{background:var(--red-tint);border-color:#f3c6bf;border-left-color:var(--red-border)}

  /* Número do pedido: negrito, espaçamento maior */
  .order-number{
    font-family:var(--num);font-size:1.3rem;font-weight:700;letter-spacing:3px;
    color:#091e42;margin-bottom:6px;
  }
  /* Cliente: MAIÚSCULO, negrito, [Código] RAZÃO SOCIAL */
  .customer-name{
    font-weight:700;font-size:.82rem;text-transform:uppercase;
    color:var(--ink);margin-bottom:8px;line-height:1.35;
  }
  /* Operador: MAIÚSCULO */
  .operator-name{
    font-size:.72rem;color:var(--ink-2);text-transform:uppercase;letter-spacing:.3px;
    border-top:1px dashed var(--line-2);padding-top:6px;padding-right:28px;
  }
  .retirada-info{font-size:.7rem;color:var(--brand-2);font-weight:700;margin-top:5px;font-family:var(--num);padding-right:28px}

  /* Botão (i) — canto inferior direito do cartão: abre a linha do tempo */
  .btn-info{
    position:absolute;bottom:8px;right:8px;
    width:22px;height:22px;padding:0;border:1px solid var(--line);background:#fff;color:var(--brand-2);
    border-radius:50%;cursor:pointer;font-size:12px;font-weight:700;line-height:1;
    font-family:var(--num);font-style:italic;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .btn-info:hover{background:var(--brand-tint);border-color:var(--brand)}
  .op-badge{
    display:inline-block;font-size:.68rem;background:var(--brand-tint);color:var(--brand-2);
    padding:2px 7px;border-radius:4px;margin-top:6px;font-weight:700;font-family:var(--num);letter-spacing:.5px;
  }
  .urgente .op-badge{background:#f7d4cd;color:#a02214}
  .empty-col{color:var(--ink-3);font-size:.75rem;text-align:center;padding:14px 0;font-style:italic}

  /* ===== JANELA (POP-UP) DA LINHA DO TEMPO ===== */
  .modal-ov{
    position:fixed;inset:0;background:rgba(9,30,66,.45);z-index:1000;padding:20px;
    display:none;align-items:center;justify-content:center;
  }
  .modal-ov.open{display:flex}
  .modal-card{
    background:#fff;border-radius:12px;max-width:400px;width:100%;max-height:85vh;overflow:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .modal-head{
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
    padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;
  }
  .modal-head .mh-num{font-family:var(--num);font-size:1.25rem;font-weight:700;letter-spacing:2px;color:#091e42}
  .modal-head .mh-cli{font-size:.72rem;text-transform:uppercase;color:var(--ink-2);margin-top:3px;font-weight:700;line-height:1.3}
  .modal-x{border:none;background:none;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--ink-2);padding:0 2px}
  .modal-x:hover{color:var(--ink)}
  .modal-body{padding:20px 18px}

  /* linha do tempo vertical */
  .timeline{list-style:none;margin:0;padding:0 2px}
  .timeline .tl{position:relative;padding:0 0 20px 28px}
  .timeline .tl:last-child{padding-bottom:0}
  .timeline .tl::before{content:'';position:absolute;left:7px;top:17px;bottom:-3px;width:2px;background:var(--line-2)}
  .timeline .tl:last-child::before{display:none}
  .tl-dot{position:absolute;left:0;top:1px;width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);background:#fff;box-sizing:border-box}
  .tl.feito .tl-dot{background:var(--brand);border-color:var(--brand)}
  .tl.feito .tl-label{color:var(--ink)}
  .tl.pend,.tl.breve{opacity:.55}
  .tl-label{font-weight:700;font-size:.78rem;color:var(--ink);text-transform:uppercase;letter-spacing:.3px;line-height:1.3}
  .tl-date{font-size:.75rem;color:var(--ink-2);font-family:var(--num);margin-top:2px}
  .tl.breve .tl-date{font-style:italic}

  /* ===== DESKTOP: as 9 colunas se ajustam à largura da tela ===== */
  @media (min-width:769px){
    .kanban-board{gap:10px;padding:14px 16px}
    .kanban-column{flex:1 1 0;min-width:0;width:auto}        /* dividem a largura igualmente */
    .column-header{padding:10px 11px;font-size:11.5px;letter-spacing:.2px}
    .cards-container{padding:8px}
    .card{padding:10px 11px}
    .order-number{font-size:1.05rem;letter-spacing:1.5px}
    .customer-name{font-size:.76rem}
  }

  /* ===== MOBILE (celular) ===== */
  @media (max-width:768px){
    /* Topbar compacta */
    .topbar{gap:6px;padding:8px 12px;flex-wrap:wrap;height:auto}
    .topbar .tb-title{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .topbar .tb-title small{display:none}
    .topbar .spacer{display:none}
    .busca{flex:1 1 130px;min-width:0;width:auto;max-width:none}
    select.busca{flex:1 1 130px;max-width:none}
    .nav-btn{padding:8px 11px;font-size:12.5px}

    /* Cada coluna quase preenche a tela; swipe "com encaixe" entre elas */
    .kanban-board{padding:12px;gap:10px;scroll-snap-type:x mandatory}
    .kanban-column{width:85vw;min-width:85vw;scroll-snap-align:start}
  }
  @media (max-width:480px){
    #lastUpdate{display:none}
    .brand-lockup .tb-title{font-size:14px}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand-lockup">
    <svg class="mark" viewBox="0 0 64 64" fill="none">
      <rect width="64" height="64" rx="13" fill="#1b4264"/>
      <g stroke="#00adee" stroke-width="3"><circle cx="24" cy="32" r="12"/><circle cx="44" cy="32" r="8"/></g>
    </svg>
    <div class="tb-title">Acompanhamento de Pedidos<small>Kanban · Belt Correias</small></div>
  </div>
  <div class="spacer"></div>
  <input id="busca" class="busca" type="search" placeholder="Pesquisar nº do pedido..." inputmode="numeric" autocomplete="off">
  <select id="filtroOperador" class="busca sel-op" title="Filtrar por operador">
    <option value="">Todos os operadores</option>
  </select>
  <div class="spacer"></div>
  <button id="btnInstall" class="nav-btn nav-btn-install hidden">⬇️ Baixar App</button>
  <a href="index.html" class="nav-btn">➕ Incluir</a>
  <div id="lastUpdate" style="margin-left:4px">Atualizado agora</div>
</header>

<main class="kanban-board" id="board"></main>

<script>
/* ============================================================
   CONFIGURAÇÃO
   ------------------------------------------------------------
   Colunas (situações) do kanban, na ordem do prompt.
   Bases de dados:
   - pedidos_sistema    (A data, B número, C cliente, D vendedor, E cancelado)
   - pedidos_separacao  (A data, B número, C urgente, D operador)
   - pedidos_retirados  (A número, B data de retirada DD/MM/AAAA HH:MM)

   Regras aplicadas:
   - Cancelado = "1" (pedidos_sistema, col. E) -> oculto de todo o processo
   - Urgente   = "1" (pedidos_separacao, col. C) -> cartão vermelho
   - Retirado  -> quando o número do pedido consta em pedidos_retirados (col. A);
                  a data de retirada (col. B) define a regra das 12h
   - Retirado visível apenas até 12h após a data de retirada
   ============================================================ */
/* IDs das planilhas (todas precisam estar compartilhadas como
   "Qualquer pessoa com o link → Leitor" para o kanban conseguir ler). */
const SHEETS = {
  sistema:   { id: '1YOehmwPZTUSG-drIzekLzlozepmmQ5wYvadWrHXAwHo', gid: '0' }, // pedidos_sistema
  separacao: { id: '13TpiMC8nVo5YCtyo2cAnz0jBxKOv5jk_DOnw6p9KkcA', gid: '0' }, // pedidos_separacao
  aprovados: { id: '1s_V8-wqx_9S4PQgX_r0A1yMVlUsSI82MBuVGOE8bIZ0', gid: '0' }, // pedidos_aprovados
  faturados: { id: '19YGc_k8-VCbuSb9hhM3SyoyLKT2HM_zlJmwhHeLUx2w', gid: '0' }, // pedidos_faturados
  retirados: { id: '1xFwKnV55LG-qfS-igCI1qR3MqoWvOKThXrZ0r69k-8w', gid: '0' }  // pedidos_retirados
};

/* URL do Apps Script da planilha pedidos_sistema — grava "1" na coluna E (cancelado).
   Cole aqui a URL /exec depois de publicar o Apps Script (ver o arquivo .gs entregue). */
const SHEETS_WEBAPP_URL_SISTEMA = 'https://script.google.com/macros/s/AKfycbzjKTXv9_i2pQ4NvnpIWc6mGvAoz-sw2iKY-318VrFsEB6qcDojxDh5HimJIUCFOKMu/exec';

/* Lê uma planilha via gviz (JSONP) — evita bloqueio de CORS.
   Resolve com uma lista de linhas; cada célula vira { v, f }
   (v = valor bruto, f = valor formatado/exibido). */
function lerPlanilha(sheetId, gid) {
  return new Promise((resolve, reject) => {
    const cb = 'gviz_' + Date.now() + '_' + Math.floor(Math.random() * 1e5);
    const url = 'https://docs.google.com/spreadsheets/d/' + sheetId + '/gviz/tq'
              + '?gid=' + gid + '&headers=0&tqx=out:json;responseHandler:' + cb
              + '&_=' + Date.now();
    const s = document.createElement('script');
    let pronto = false;
    const limpar = () => { try { delete window[cb]; } catch (e) {} s.remove(); };
    window[cb] = (resp) => { pronto = true; limpar(); try { resolve(gvizLinhas(resp)); } catch (err) { reject(err); } };
    s.onerror = () => { if (!pronto) { limpar(); reject(new Error('Falha ao ler planilha ' + sheetId)); } };
    setTimeout(() => { if (!pronto) { limpar(); reject(new Error('Tempo esgotado na planilha ' + sheetId)); } }, 15000);
    s.src = url;
    document.head.appendChild(s);
  });
}

function gvizLinhas(resp) {
  const rows = (resp && resp.table && resp.table.rows) || [];
  return rows.map(r => (r.c || []).map(c => ({
    v: (c && c.v != null) ? c.v : '',
    f: (c && c.f != null) ? c.f : ((c && c.v != null) ? String(c.v) : '')
  })));
}

/* Célula -> número do pedido (só dígitos, para casar entre as bases) */
function numCel(cel) {
  if (!cel) return '';
  const bruto = (cel.v !== '' && cel.v != null) ? cel.v : cel.f;
  return String(bruto).replace(/[^\d]/g, '');
}
/* Célula -> texto exibido */
function txtCel(cel) { return cel ? String(cel.f || cel.v || '').trim() : ''; }
const COLUNAS = [
  { id:'pendente',     titulo:'Pendente' },
  { id:'compras',      titulo:'Em Compras' },
  { id:'separacao',    titulo:'Em Separação' },
  { id:'lib-prod',     titulo:'Liberado Para Produção' },
  { id:'producao',     titulo:'Em Produção' },
  { id:'conferencia',  titulo:'Em Conferência' },
  { id:'aprovado',     titulo:'Aprovado' },
  { id:'faturado',     titulo:'Faturado' },
  { id:'retirado',     titulo:'Retirado' }
];

// Guarda a lista de pedidos de cada coluna (para o download em Excel)
let dadosColunas = {};

// Dados da linha do tempo de cada pedido (nº -> datas de cada etapa)
let linhaTempo = {};

/* Etapas da linha do tempo, na ordem. As quatro etapas intermediárias ainda
   não têm base de dados própria, então aparecem como "(em breve)". */
const ETAPAS = [
  { rotulo:'Pedido criado em',                 chave:'dtCriado'    },
  { rotulo:'Pedido enviado para separação em', chave:'dtSeparacao' },
  { rotulo:'Pedido em compras desde',          breve:true          },
  { rotulo:'Pedido liberado para produção em', breve:true          },
  { rotulo:'Pedido em produção desde',         breve:true          },
  { rotulo:'Pedido em conferência desde',      breve:true          },
  { rotulo:'Pedido aprovado em',               chave:'dtAprovado'  },
  { rotulo:'Pedido faturado em',               chave:'dtFaturado'  },
  { rotulo:'Pedido retirado em',               chave:'dtRetirado'  }
];

/* ---------- utilitários de data ---------- */
function parseDate(dateStr) {
  if (!dateStr) return null;
  const parts = dateStr.trim().split(' ');
  const d = parts[0].split('/');
  const t = parts[1] ? parts[1].split(':') : [0, 0, 0];
  return new Date(d[2], d[1] - 1, d[0], t[0] || 0, t[1] || 0, t[2] || 0);
}

// Retirado há mais de 12h -> deve ser ocultado
function retiradoVencido(dataRetiradaStr) {
  const dt = parseDate(dataRetiradaStr);
  if (!dt) return false;
  return (new Date() - dt) / 36e5 > 12;
}

/* ---------- montagem das colunas ---------- */
function montarColunas() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  COLUNAS.forEach(col => {
    const sec = document.createElement('section');
    sec.className = 'kanban-column';
    sec.innerHTML = `
      <div class="column-header">
        <span><span class="dot"></span>${col.titulo}</span>
        <span class="hdr-right">
          <span class="card-count" id="cnt-${col.id}">0</span>
          <button class="btn-dl" data-col="${col.id}" title="Baixar lista em Excel">⬇</button>
        </span>
      </div>
      <div class="cards-container" id="col-${col.id}"></div>`;
    board.appendChild(sec);
  });
}

/* ---------- cartão ---------- */
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
}
function fmtDataHora(s) {
  s = String(s || '').trim();
  const m = s.match(/^(\d{2}\/\d{2}\/\d{4}\s+\d{2}:\d{2})/);
  return m ? m[1] : s;
}

function renderCard(pedido) {
  const card = document.createElement('article');
  const urgente = pedido.urgente === 1 || pedido.urgente === '1';
  card.className = 'card' + (urgente ? ' urgente' : '');
  card.innerHTML = `
    ${pedido.cancelavel ? `<button class="btn-lixo" data-num="${esc(pedido.numero)}" title="Cancelar pedido">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
    </button>` : ''}
    <div class="order-number">${esc(pedido.numero)}</div>
    <div class="customer-name">${esc(pedido.cliente || '[0000] CLIENTE NÃO IDENTIFICADO')}</div>
    <div class="operator-name">${esc((pedido.operador || 'DESCONHECIDO').toUpperCase())}</div>
    ${pedido.dataRetirada ? `<div class="retirada-info">Retirado em ${esc(pedido.dataRetirada)}</div>` : ''}
    <button class="btn-info" data-info="${esc(pedido.numero)}" title="Linha do tempo do pedido">i</button>`;
  return card;
}

/* ---------- janela (pop-up) da linha do tempo ---------- */
function abrirLinhaTempo(numero) {
  const d = linhaTempo[numero] || {};
  document.getElementById('mlNum').textContent = '#' + numero;
  document.getElementById('mlCli').textContent = d.cliente || '';
  document.getElementById('mlLista').innerHTML = ETAPAS.map(e => {
    if (e.breve) {
      return `<li class="tl breve"><span class="tl-dot"></span><div>
        <div class="tl-label">${e.rotulo}</div>
        <div class="tl-date">(em breve)</div></div></li>`;
    }
    const data = fmtDataHora(d[e.chave] || '');
    const feito = !!data;
    return `<li class="tl ${feito ? 'feito' : 'pend'}"><span class="tl-dot"></span><div>
      <div class="tl-label">${e.rotulo}</div>
      <div class="tl-date">${feito ? esc(data) : '— sem registro'}</div></div></li>`;
  }).join('');
  document.getElementById('modalLinha').classList.add('open');
}
function fecharLinhaTempo() {
  document.getElementById('modalLinha').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharLinhaTempo(); });

/* ---------- contadores + placeholder ---------- */
function atualizarContadores() {
  COLUNAS.forEach(col => {
    const container = document.getElementById('col-' + col.id);
    // conta só os cartões exibidos normalmente (retirados +12h ficam de fora)
    const visiveis = container.querySelectorAll('.card:not(.vencido)').length;
    document.getElementById('cnt-' + col.id).textContent = visiveis;
    // placeholder só quando não há NENHUM cartão (para não apagar o histórico oculto)
    if (!container.querySelector('.card')) {
      container.innerHTML = '<div class="empty-col">Sem pedidos</div>';
    }
  });
}

/* ---------- carregamento das bases reais ----------
   Cada pedido é montado pela UNIÃO das bases (casadas pelo número):
   - pedidos_sistema   -> cliente, vendedor, cancelado
   - pedidos_separacao -> marca "Em Separação", urgente, operador
   - pedidos_aprovados -> marca "Aprovado"        (col. A = número)
   - pedidos_faturados -> marca "Faturado"        (col. E = número(s))
   - pedidos_retirados -> marca "Retirado" + data de retirada
   Situação (da mais avançada p/ a menos):
     Retirado > Faturado > Aprovado > Em Separação > Pendente.
   (Em Compras, Liberado p/ Produção, Em Produção e Em Conferência ainda
    não têm base definida.) Regras: cancelado (sistema col. E = "1") some;
   urgente (separacao col. C = "1") fica vermelho; retirado some após 12h. */
async function carregarKanban() {
  montarColunas();
  dadosColunas = {};   // zera os dados de exportação a cada atualização
  linhaTempo  = {};    // zera os dados da linha do tempo a cada atualização

  // Lê as bases de forma tolerante: se uma falhar (ex.: não compartilhada),
  // as demais continuam funcionando — não quebra o kanban inteiro.
  const res = await Promise.allSettled([
    lerPlanilha(SHEETS.sistema.id,   SHEETS.sistema.gid),
    lerPlanilha(SHEETS.separacao.id, SHEETS.separacao.gid),
    lerPlanilha(SHEETS.aprovados.id, SHEETS.aprovados.gid),
    lerPlanilha(SHEETS.faturados.id, SHEETS.faturados.gid),
    lerPlanilha(SHEETS.retirados.id, SHEETS.retirados.gid)
  ]);
  const val = i => (res[i].status === 'fulfilled' ? res[i].value : []);
  const sistema = val(0), separacao = val(1), aprovados = val(2),
        faturados = val(3), retirados = val(4);

  const nomes = ['pedidos_sistema', 'pedidos_separacao', 'pedidos_aprovados',
                 'pedidos_faturados', 'pedidos_retirados'];
  const falhas = nomes.filter((_, i) => res[i].status !== 'fulfilled');

  // Une as bases pelo número do pedido
  const pedidos = {};
  const obter = num => (pedidos[num] || (pedidos[num] = {
    numero: num, cliente: '', operador: '', urgente: 0, cancelado: false,
    emSeparacao: false, aprovado: false, faturado: false, retirado: false, dataRetirada: '',
    dtCriado: '', dtSeparacao: '', dtAprovado: '', dtFaturado: ''
  }));

  /* ===== MAPA DAS COLUNAS DE DATA (ajuste aqui se alguma estiver errada) =====
     Presumi que cada base guarda a data/hora na coluna A (a 1ª coluna),
     exceto 'aprovados', cujo número está em A e a data em B. Se não bater,
     é só trocar o índice: row[0]=A, row[1]=B, row[2]=C, row[3]=D, row[4]=E. */
  sistema.forEach(row => {
    const num = numCel(row[1]); if (!num) return;                 // B = número
    const p = obter(num);
    const cli = txtCel(row[2]); if (cli) p.cliente = cli;         // C = cliente
    const vend = txtCel(row[3]); if (vend && !p.operador) p.operador = vend; // D = vendedor
    if (txtCel(row[4]) === '1') p.cancelado = true;              // E = cancelado
    const dc = txtCel(row[0]); if (dc && !p.dtCriado) p.dtCriado = dc;       // A = data de criação
  });

  separacao.forEach(row => {
    const num = numCel(row[1]); if (!num) return;                 // B = número
    const p = obter(num);
    p.emSeparacao = true;
    if (txtCel(row[2]) === '1') p.urgente = 1;                    // C = urgente
    const op = txtCel(row[3]); if (op) p.operador = op;           // D = operador (prioritário)
    const ds = txtCel(row[0]); if (ds && !p.dtSeparacao) p.dtSeparacao = ds; // A = data de envio p/ separação
  });

  aprovados.forEach(row => {
    const num = numCel(row[0]); if (!num) return;                 // A = número
    const p = obter(num);
    p.aprovado = true;
    const da = txtCel(row[1]); if (da) p.dtAprovado = da;          // B = data de aprovação
  });

  faturados.forEach(row => {
    // Coluna E pode ter mais de um pedido por nota (ex.: "94308, 94309")
    const campoE = txtCel(row[4]); if (!campoE) return;           // E = número(s)
    const df = txtCel(row[0]);                                    // A = data de faturamento
    campoE.split(',').forEach(parte => {
      const num = String(parte).replace(/[^\d]/g, '');
      if (num) { const p = obter(num); p.faturado = true; if (df) p.dtFaturado = df; }
    });
  });

  retirados.forEach(row => {
    const num = numCel(row[0]); if (!num) return;                 // A = número
    const p = obter(num);
    p.retirado = true;
    p.dataRetirada = txtCel(row[1]);                              // B = data de retirada
  });

  // Distribui nas colunas pela situação mais avançada
  Object.keys(pedidos).forEach(num => {
    const p = pedidos[num];
    if (p.cancelado) return;                                      // cancelado some

    // guarda as datas para a linha do tempo (inclui retirados ocultos +12h)
    linhaTempo[p.numero] = {
      cliente:     p.cliente || '',
      dtCriado:    p.dtCriado,
      dtSeparacao: p.dtSeparacao,
      dtAprovado:  p.dtAprovado,
      dtFaturado:  p.dtFaturado,
      dtRetirado:  p.dataRetirada
    };

    let status = 'pendente', vencido = false;
    if (p.retirado) {
      status = 'retirado';
      vencido = retiradoVencido(p.dataRetirada);   // +12h: fica oculto, mas disponível na busca
    } else if (p.faturado) {
      status = 'faturado';
    } else if (p.aprovado) {
      status = 'aprovado';
    } else if (p.emSeparacao) {
      status = 'separacao';
    }

    const container = document.getElementById('col-' + status);
    if (!container) return;

    const card = renderCard({
      numero: p.numero, cliente: p.cliente, operador: p.operador, urgente: p.urgente,
      dataRetirada: status === 'retirado' ? fmtDataHora(p.dataRetirada) : '',
      cancelavel: status === 'pendente'   // botão de lixeira só na coluna Pendente
    });
    if (vencido) card.classList.add('vencido');    // oculto no uso normal (só a busca revela)
    container.appendChild(card);

    // Excel: exporta o que é exibido normalmente (retirados +12h ficam de fora)
    if (!vencido) {
      (dadosColunas[status] = dadosColunas[status] || []).push({
        numero: p.numero,
        cliente: p.cliente || '',
        operador: (p.operador || '').toUpperCase(),
        urgente: p.urgente ? 'SIM' : ''
      });
    }
  });

  atualizarContadores();
  popularFiltroOperador();   // atualiza a lista de operadores
  aplicarFiltro();           // reaplica busca + filtro de operador
  const hora = new Date().toLocaleTimeString('pt-BR');
  document.getElementById('lastUpdate').textContent = falhas.length
    ? 'Atualizado às ' + hora + ' — sem acesso a: ' + falhas.join(', ')
    : 'Atualizado às ' + hora;
}

/* ---------- lista de operadores (preenchida pelos próprios pedidos) ---------- */
function popularFiltroOperador() {
  const sel = document.getElementById('filtroOperador');
  const atual = sel.value;
  const nomes = new Set();
  document.querySelectorAll('.operator-name').forEach(el => {
    const n = el.textContent.trim();
    if (n && n !== 'DESCONHECIDO') nomes.add(n);
  });
  const ordenados = Array.from(nomes).sort((a, b) => a.localeCompare(b, 'pt-BR'));

  sel.innerHTML = '';
  const todos = document.createElement('option');
  todos.value = ''; todos.textContent = 'Todos os operadores';
  sel.appendChild(todos);
  ordenados.forEach(n => {
    const o = document.createElement('option');
    o.value = n; o.textContent = n;
    sel.appendChild(o);
  });
  if (atual && ordenados.includes(atual)) sel.value = atual;   // mantém a seleção
}

/* ---------- filtro: número do pedido + operador ---------- */
function aplicarFiltro() {
  const termo = (document.getElementById('busca').value || '').replace(/\D/g, '');
  const operador = document.getElementById('filtroOperador').value;

  document.querySelectorAll('.card').forEach(card => {
    const elNum = card.querySelector('.order-number');
    const num = (elNum ? elNum.textContent : '').replace(/\D/g, '');
    const elOp = card.querySelector('.operator-name');
    const op = (elOp ? elOp.textContent : '').trim();

    const opOk = !operador || op === operador;
    const buscaOk = termo
      ? num.includes(termo)                       // com busca: revela histórico (+12h)
      : !card.classList.contains('vencido');      // sem busca: esconde retirados +12h

    card.style.display = (opOk && buscaOk) ? '' : 'none';
  });
}
document.getElementById('busca').addEventListener('input', aplicarFiltro);
document.getElementById('filtroOperador').addEventListener('change', aplicarFiltro);

/* ---------- download da coluna em Excel ---------- */
function baixarColuna(colId) {
  const col = COLUNAS.find(c => c.id === colId);
  const titulo = col ? col.titulo : colId;
  const lista = dadosColunas[colId] || [];
  if (!lista.length) {
    alert('Não há pedidos na coluna "' + titulo + '".');
    return;
  }

  const cabecalho = ['Número do Pedido', 'Cliente', 'Operador', 'Urgente'];
  const aoa = [cabecalho].concat(lista.map(p => [p.numero, p.cliente, p.operador, p.urgente]));
  const data = new Date().toISOString().slice(0, 10);

  if (window.XLSX) {
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{ wch: 16 }, { wch: 40 }, { wch: 28 }, { wch: 9 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, titulo.slice(0, 31));
    XLSX.writeFile(wb, 'pedidos_' + colId + '_' + data + '.xlsx');
  } else {
    // Reserva: se a biblioteca não carregou, baixa em CSV (abre no Excel)
    const csv = '﻿' + aoa.map(l =>
      l.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(';')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'pedidos_' + colId + '_' + data + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }
}

/* ---------- cancelar pedido (grava "1" na coluna E de pedidos_sistema) ---------- */
async function cancelarPedido(numero, botao) {
  if (!SHEETS_WEBAPP_URL_SISTEMA) {
    alert('Cancelamento não configurado: falta publicar o Apps Script da "pedidos_sistema" e colar a URL no arquivo (SHEETS_WEBAPP_URL_SISTEMA).');
    return;
  }
  if (!confirm('Cancelar o pedido #' + numero + '?\nEle sairá do acompanhamento.')) return;

  const card = botao.closest('.card');
  botao.disabled = true;
  try {
    const r = await fetch(SHEETS_WEBAPP_URL_SISTEMA, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ acao: 'cancelar', pedido: numero })
    });
    let resp = {};
    try { resp = await r.json(); } catch (_) { resp = { ok: true }; }
    if (resp && resp.ok === false) throw new Error(resp.erro || 'Falha ao cancelar.');
    if (card) card.remove();      // some na hora (a base também atualiza no próximo refresh)
    atualizarContadores();
  } catch (err) {
    alert('Não foi possível cancelar: ' + err.message);
    botao.disabled = false;
  }
}

// Cliques do quadro (delegado — sobrevive às atualizações): download e lixeira
document.getElementById('board').addEventListener('click', e => {
  const dl = e.target.closest('.btn-dl');
  if (dl) { baixarColuna(dl.getAttribute('data-col')); return; }
  const lixo = e.target.closest('.btn-lixo');
  if (lixo) { cancelarPedido(lixo.getAttribute('data-num'), lixo); return; }
  const info = e.target.closest('.btn-info');
  if (info) { abrirLinhaTempo(info.getAttribute('data-info')); return; }
});

/* ---------- rolagem automática (carrossel) das colunas cheias ---------- */
const ROLAGEM_PASSO     = 1;      // pixels por passo (quanto maior, mais rápido)
const ROLAGEM_INTERVALO = 50;     // ms entre os passos
const ROLAGEM_PAUSA_FIM = 2000;   // ms parado no fim antes de voltar ao topo
const _esperandoFim = new WeakMap();

setInterval(() => {
  document.querySelectorAll('.cards-container').forEach(cont => {
    // só rola se a coluna tiver mais cartões do que cabe (barra de rolagem)
    if (cont.scrollHeight <= cont.clientHeight + 2) return;

    // pausa se o mouse estiver em cima da coluna
    const col = cont.closest('.kanban-column');
    if (col && col.matches(':hover')) return;

    // chegou ao fim: aguarda um instante e volta ao topo
    const ate = _esperandoFim.get(cont);
    if (ate) {
      if (Date.now() >= ate) { _esperandoFim.delete(cont); cont.scrollTop = 0; }
      return;
    }

    cont.scrollTop += ROLAGEM_PASSO;
    if (cont.scrollTop + cont.clientHeight >= cont.scrollHeight - 1) {
      _esperandoFim.set(cont, Date.now() + ROLAGEM_PAUSA_FIM);
    }
  });
}, ROLAGEM_INTERVALO);

carregarKanban();
setInterval(carregarKanban, 30000); // recarrega a cada 30s

/* ---------- PWA: botão "Baixar App" ---------- */
(function () {
  let deferredPrompt = null;
  const btn = document.getElementById('btnInstall');
  if (!btn) return;

  const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
  const instalado = () =>
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;
  const mostrar = (v) => btn.classList.toggle('hidden', !v);

  // Mostra o botão sempre que o app NÃO estiver aberto como instalado
  mostrar(!instalado());

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    mostrar(!instalado());
  });

  btn.addEventListener('click', async () => {
    if (deferredPrompt) {              // Android/Chrome/Edge: instalação nativa
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      return;
    }
    if (isIOS()) {                     // iPhone/iPad (Safari): instruções
      alert('Para instalar no iPhone/iPad (Safari):\n\n1. Toque no botão Compartilhar (quadrado com a seta para cima).\n2. Escolha "Adicionar à Tela de Início".\n3. Toque em "Adicionar".');
    } else {                           // Demais casos: instruções gerais
      alert('Para instalar o app:\n\n• Android (Chrome): menu ⋮ → "Instalar app" / "Adicionar à tela inicial".\n• Computador (Chrome/Edge): ícone de instalar na barra de endereço.\n\nSe a opção não aparecer, abra a página pelo endereço do site (https), com internet, e tente de novo.');
    }
  });

  window.addEventListener('appinstalled', () => mostrar(false));
})();
