<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kanban de Pedidos · Belt Correias</title>
<meta name="theme-color" content="#424580">
<meta name="description" content="Acompanhamento visual (kanban) do andamento dos pedidos da Belt Correias.">
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kanban Belt">
<link rel="icon" type="image/png" sizes="48x48" href="./favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f0f5fa;
    --surface:#ffffff;
    --surface-2:#f7fafc;
    --ink:#1e293b;
    --ink-2:#475569;
    --ink-3:#94a3b8;
    --line:#d1d5db;
    --line-2:#c3ccd6;
    --bar:#424580;
    --bar-2:#1b4264;
    --brand:#00adee;
    --brand-2:#0092c9;
    --brand-ink:#424580;
    --brand-tint:#e1f4fc;
    --red:#cf3a2c;
    --red-tint:#fbe6e3;
    --red-border:#de350b;
    --shadow-sm:0 1px 2px rgba(16,25,30,.08);
    --r:12px;
    --r-sm:8px;
    --sans:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    --num:'Space Grotesk','IBM Plex Sans',system-ui,sans-serif;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100vh}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:var(--bg);
    display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== TOPBAR ===== */
  .topbar{
    background:var(--bar);color:#eaf6f5;flex:0 0 auto;
    display:flex;align-items:center;gap:14px;padding:0 22px;height:60px;
  }
  .brand-lockup{display:flex;align-items:center;gap:12px}
  .brand-lockup .mark{width:34px;height:34px}
  .topbar .tb-title{font-family:var(--num);font-weight:600;font-size:15px}
  .topbar .tb-title small{display:block;font-family:var(--sans);font-weight:400;font-size:11px;color:#c3c6ea}
  .topbar .spacer{flex:1}
  .nav-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;padding:8px 14px;border-radius:var(--r-sm);text-decoration:none;font-size:13px;font-weight:600}
  .nav-btn:hover{background:rgba(255,255,255,.2)}
  #lastUpdate{font-size:12px;color:#c3c6ea}

  /* ===== BOARD ===== */
  .kanban-board{
    display:flex;gap:12px;overflow-x:auto;flex:1;align-items:flex-start;
    padding:16px 18px;
  }
  .kanban-column{
    background:var(--surface-2);
    width:270px;min-width:270px;
    border:1px solid var(--line);
    border-radius:var(--r);
    display:flex;flex-direction:column;max-height:100%;
    box-shadow:var(--shadow-sm);
  }
  .column-header{
    padding:12px 14px;font-weight:600;font-size:12.5px;
    text-transform:uppercase;letter-spacing:.4px;color:var(--ink-2);
    display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid var(--line);
  }
  .column-header .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brand);margin-right:8px;vertical-align:middle}
  .card-count{
    background:var(--brand-tint);color:var(--brand-2);
    padding:2px 9px;border-radius:10px;font-size:11.5px;font-weight:700;font-family:var(--num);
  }
  .cards-container{
    padding:10px;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;min-height:80px;
  }

  /* ===== CARTÃO ===== */
  .card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r-sm);padding:12px 13px;
    box-shadow:var(--shadow-sm);border-left:4px solid var(--brand);
  }
  .card.urgente{background:var(--red-tint);border-color:#f3c6bf;border-left-color:var(--red-border)}

  /* Número do pedido: negrito, espaçamento maior */
  .order-number{
    font-family:var(--num);font-size:1.3rem;font-weight:700;letter-spacing:3px;
    color:#091e42;margin-bottom:6px;
  }
  /* Cliente: MAIÚSCULO, negrito, [Código] RAZÃO SOCIAL */
  .customer-name{
    font-weight:700;font-size:.82rem;text-transform:uppercase;
    color:var(--ink);margin-bottom:8px;line-height:1.35;
  }
  /* Operador: MAIÚSCULO */
  .operator-name{
    font-size:.72rem;color:var(--ink-2);text-transform:uppercase;letter-spacing:.3px;
    border-top:1px dashed var(--line-2);padding-top:6px;
  }
  .op-badge{
    display:inline-block;font-size:.68rem;background:var(--brand-tint);color:var(--brand-2);
    padding:2px 7px;border-radius:4px;margin-top:6px;font-weight:700;font-family:var(--num);letter-spacing:.5px;
  }
  .urgente .op-badge{background:#f7d4cd;color:#a02214}
  .empty-col{color:var(--ink-3);font-size:.75rem;text-align:center;padding:14px 0;font-style:italic}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand-lockup">
    <svg class="mark" viewBox="0 0 64 64" fill="none">
      <rect width="64" height="64" rx="13" fill="#1b4264"/>
      <g stroke="#00adee" stroke-width="3"><circle cx="24" cy="32" r="12"/><circle cx="44" cy="32" r="8"/></g>
    </svg>
    <div class="tb-title">Acompanhamento de Pedidos<small>Kanban · Belt Correias</small></div>
  </div>
  <div class="spacer"></div>
  <a href="index.html" class="nav-btn">➕ Incluir</a>
  <div id="lastUpdate" style="margin-left:4px">Atualizado agora</div>
</header>

<main class="kanban-board" id="board"></main>

<script>
/* ============================================================
   CONFIGURAÇÃO
   ------------------------------------------------------------
   Colunas (situações) do kanban, na ordem do prompt.
   Bases de dados:
   - pedidos_sistema    (A data, B número, C cliente, D vendedor, E cancelado)
   - pedidos_separacao  (A data, B número, C urgente, D operador)

   Regras aplicadas:
   - Cancelado = "1" (pedidos_sistema, col. E) -> oculto de todo o processo
   - Urgente   = "1" (pedidos_separacao, col. C) -> cartão vermelho
   - Retirado  -> visível apenas até 12h após o registro
   ============================================================ */
const COLUNAS = [
  { id:'pendente',     titulo:'Pendente' },
  { id:'compras',      titulo:'Em Compras' },
  { id:'separacao',    titulo:'Em Separação' },
  { id:'lib-prod',     titulo:'Liberado Para Produção' },
  { id:'producao',     titulo:'Em Produção' },
  { id:'conferencia',  titulo:'Em Conferência' },
  { id:'aprovado',     titulo:'Aprovado' },
  { id:'faturado',     titulo:'Faturado' },
  { id:'retirado',     titulo:'Retirado' }
];

/* ---------- utilitários de data ---------- */
function parseDate(dateStr) {
  if (!dateStr) return null;
  const parts = dateStr.trim().split(' ');
  const d = parts[0].split('/');
  const t = parts[1] ? parts[1].split(':') : [0, 0, 0];
  return new Date(d[2], d[1] - 1, d[0], t[0] || 0, t[1] || 0, t[2] || 0);
}

// Retirado há mais de 12h -> deve ser ocultado
function retiradoVencido(dataRetiradaStr) {
  const dt = parseDate(dataRetiradaStr);
  if (!dt) return false;
  return (new Date() - dt) / 36e5 > 12;
}

/* ---------- montagem das colunas ---------- */
function montarColunas() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  COLUNAS.forEach(col => {
    const sec = document.createElement('section');
    sec.className = 'kanban-column';
    sec.innerHTML = `
      <div class="column-header">
        <span><span class="dot"></span>${col.titulo}</span>
        <span class="card-count" id="cnt-${col.id}">0</span>
      </div>
      <div class="cards-container" id="col-${col.id}"></div>`;
    board.appendChild(sec);
  });
}

/* ---------- cartão ---------- */
function renderCard(pedido) {
  const card = document.createElement('article');
  const urgente = pedido.urgente === 1 || pedido.urgente === '1';
  card.className = 'card' + (urgente ? ' urgente' : '');
  card.innerHTML = `
    <div class="order-number">${pedido.numero}</div>
    <div class="customer-name">${pedido.cliente || '[0000] CLIENTE NÃO IDENTIFICADO'}</div>
    <div class="operator-name">Op: ${(pedido.operador || 'DESCONHECIDO').toUpperCase()}</div>
    ${pedido.op ? `<div class="op-badge">OP: ${pedido.op}</div>` : ''}`;
  return card;
}

/* ---------- carregamento ---------- */
function carregarKanban() {
  montarColunas();

  /* DADOS DE EXEMPLO — na próxima etapa virão das planilhas publicadas.
     'cancelado' e 'dataRetirada' demonstram as regras de ocultação. */
  const pedidos = [
    { numero:'94968', cliente:'[102] METALURGICA SILVA LTDA',  operador:'JOÃO MARCELO DA CUNHA AGUIAR',   status:'pendente',    urgente:0, op:'',      cancelado:0 },
    { numero:'94971', cliente:'[150] FERRAGENS UNIAO ME',       operador:'IVANIR COSTA DA CONCEICAO',       status:'compras',     urgente:0, op:'',      cancelado:0 },
    { numero:'94969', cliente:'[205] IND BAZAR BRASIL S/A',     operador:'CARLOS EDUARDO LAMBERTI IEGGLE',  status:'separacao',   urgente:1, op:'37757', cancelado:0 },
    { numero:'94972', cliente:'[311] TRANSPORTES RAPIDO LTDA',  operador:'CHRISTIAN SILVA HEBERLE',         status:'lib-prod',    urgente:0, op:'37760', cancelado:0 },
    { numero:'94973', cliente:'[077] MINERACAO VALE VERDE',     operador:'SAMUEL DOS SANTOS FERREIRA',      status:'producao',    urgente:1, op:'37761', cancelado:0 },
    { numero:'94974', cliente:'[412] AGRO MAQUINAS OESTE',      operador:'VALDISNEI DE MAMAN',              status:'conferencia', urgente:0, op:'',      cancelado:0 },
    { numero:'94966', cliente:'[205] IND BAZAR BRASIL S/A',     operador:'CARLOS EDUARDO LAMBERTI IEGGLE',  status:'aprovado',    urgente:0, op:'37750', cancelado:0 },
    { numero:'94960', cliente:'[102] METALURGICA SILVA LTDA',   operador:'JOÃO MARCELO DA CUNHA AGUIAR',    status:'faturado',    urgente:0, op:'',      cancelado:0 },
    { numero:'94970', cliente:'[301] COMERCIAL PRIMAVERA LTDA', operador:'SAMUEL DOS SANTOS FERREIRA',      status:'retirado',    urgente:0, op:'',      cancelado:0, dataRetirada: proximoDe(2) },  // < 12h: visível
    { numero:'94965', cliente:'[088] AUTO PECAS SUL LTDA',      operador:'VALDISNEI DE MAMAN',              status:'retirado',    urgente:0, op:'',      cancelado:0, dataRetirada: proximoDe(20) }, // > 12h: oculto
    { numero:'94958', cliente:'[150] FERRAGENS UNIAO ME',       operador:'IVANIR COSTA DA CONCEICAO',       status:'producao',    urgente:0, op:'37740', cancelado:1 }  // cancelado: oculto
  ];

  pedidos.forEach(ped => {
    if (ped.cancelado === 1 || ped.cancelado === '1') return;                 // regra: cancelado some
    if (ped.status === 'retirado' && retiradoVencido(ped.dataRetirada)) return; // regra: 12h
    const container = document.getElementById('col-' + ped.status);
    if (container) container.appendChild(renderCard(ped));
  });

  // contadores + placeholder de coluna vazia
  COLUNAS.forEach(col => {
    const container = document.getElementById('col-' + col.id);
    const n = container.childElementCount;
    document.getElementById('cnt-' + col.id).textContent = n;
    if (n === 0) container.innerHTML = '<div class="empty-col">Sem pedidos</div>';
  });

  document.getElementById('lastUpdate').textContent =
    'Atualizado às ' + new Date().toLocaleTimeString('pt-BR');
}

// helper só para o exemplo: retorna um horário DD/MM/AAAA HH:MM de X horas atrás
function proximoDe(horasAtras) {
  const d = new Date(Date.now() - horasAtras * 36e5);
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}:00`;
}

carregarKanban();
setInterval(carregarKanban, 30000); // recarrega a cada 30s

/* ---------- PWA: registra o service worker (app instalável) ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
